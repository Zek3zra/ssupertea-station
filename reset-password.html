<!doctype html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E5B3B">
  <meta name="robots" content="noindex, nofollow">
  <title>Ssupertea Station | Reset password</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/account.css">
  <script type="module" src="/js/reset-password.js"></script>
  <style>
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--cream-100,#f7f3e9)}
    .reset-shell{width:min(100%,460px);padding:26px;border:1px solid var(--border,rgba(14,91,59,.14));border-radius:24px;background:#fff;box-shadow:0 20px 50px rgba(14,55,39,.12)}
    .reset-brand{display:flex;align-items:center;gap:11px;margin-bottom:22px;color:var(--green-950,#153c2e);font-weight:900;text-decoration:none}
    .reset-brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--green-800,#0e5b3b);color:#fff;font-weight:900}
    .reset-eyebrow{margin:0;color:var(--green-700,#1a6d4a);font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:7px 0 8px;color:var(--green-950,#153c2e);font-size:1.8rem;letter-spacing:-.04em}
    .reset-copy{margin:0 0 20px;color:var(--ink-500,#6b7b73);font-size:.82rem;line-height:1.6}
    .reset-form{display:grid;gap:14px}
    .reset-form label{display:grid;gap:7px;color:var(--ink-700,#42584e);font-size:.72rem;font-weight:800}
    .reset-form input{min-height:46px;padding:0 13px;border:1px solid var(--border,rgba(14,91,59,.18));border-radius:12px;background:#fff;color:var(--green-950,#153c2e);font:inherit}
    .reset-form button{min-height:48px;border:0;border-radius:13px;background:var(--green-800,#0e5b3b);color:#fff;font:inherit;font-size:.8rem;font-weight:900;cursor:pointer}
    .reset-form button:disabled{opacity:.6;cursor:default}
    .reset-status{margin:14px 0 0;padding:11px 12px;border-radius:11px;background:#f2f5f3;color:var(--ink-700,#42584e);font-size:.72rem;line-height:1.5}
    .reset-status[data-type="error"]{background:#fff0f0;color:#8a3030}
    .reset-status[data-type="success"]{background:#edf8f0;color:var(--green-800,#0e5b3b)}
    .reset-back{margin-top:16px;display:inline-flex;color:var(--green-800,#0e5b3b);font-size:.72rem;font-weight:850;text-decoration:none}
  </style>
</head>
<body>
  <main class="reset-shell">
    <a class="reset-brand" href="/">
      <span class="reset-brand-mark" aria-hidden="true">S</span>
      <span>Ssupertea Station</span>
    </a>

    <p class="reset-eyebrow">Account security</p>
    <h1>Choose a new password</h1>
    <p class="reset-copy">Use at least 8 characters. After saving it, sign in again with your new password.</p>

    <form class="reset-form" id="reset-password-form">
      <label>
        <span>New password</span>
        <input id="reset-password" type="password" autocomplete="new-password" minlength="8" required disabled>
      </label>
      <label>
        <span>Confirm new password</span>
        <input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required disabled>
      </label>
      <button id="reset-password-submit" type="submit" disabled>Update password</button>
    </form>

    <p class="reset-status" id="reset-password-status" role="status" aria-live="polite">Checking your reset link…</p>
    <a class="reset-back" href="/">← Back to Ssupertea Station</a>
  </main>
</body>
</html>
