<!doctype html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="theme-color"
    content="#ffffff"
  >
  <meta
    name="robots"
    content="noindex, nofollow"
  >
  <title>Ssupertea Station | Signing in</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="96x96">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" sizes="180x180">
  <link
    rel="stylesheet"
    href="/css/style.css"
  >
  <link
    rel="stylesheet"
    href="/css/account.css"
  >
  <script
    type="module"
    src="/js/auth-callback.js"
  ></script>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="auth-callback-page">
  <main class="auth-callback-card">
    <span
      class="auth-callback-spinner"
      aria-hidden="true"
    ></span>
    <h1>Completing sign-in</h1>
    <p
      id="auth-callback-status"
      role="status"
      aria-live="polite"
    >
      Verifying your Ssupertea account…
    </p>
  </main>
</body>
</html>
