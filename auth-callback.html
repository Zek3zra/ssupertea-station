<!doctype html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="theme-color"
    content="#0E5B3B"
  >
  <meta
    name="robots"
    content="noindex, nofollow"
  >
  <title>Ssupertea Station | Signing in</title>
  <link
    rel="stylesheet"
    href="/css/style.css"
  >
  <link
    rel="stylesheet"
    href="/css/account.css"
  >
  <script
    type="module"
    src="/js/auth-callback.js"
  ></script>
</head>
<body class="auth-callback-page">
  <main class="auth-callback-card">
    <span
      class="auth-callback-spinner"
      aria-hidden="true"
    ></span>
    <h1>Completing sign-in</h1>
    <p
      id="auth-callback-status"
      role="status"
      aria-live="polite"
    >
      Verifying your Ssupertea account…
    </p>
  </main>
</body>
</html>
